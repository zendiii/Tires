<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0a0a" />
    <script>
      /*
       * Pick the theme BEFORE anything renders. This must stay an inline,
       * blocking script: the app bundle and stylesheet load later, so if this
       * waited for them, a light-mode visitor would see the dark page flash
       * on every load. Same rules as src/services/theme.ts — a saved choice
       * wins, otherwise follow the OS. The colors are --surface from
       * src/index.css, for the mobile browser toolbar.
       */
      (function () {
        var theme = 'dark'
        try {
          var saved = localStorage.getItem('dinos-tires.theme')
          theme =
            saved === 'light' || saved === 'dark'
              ? saved
              : matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
        } catch (e) {}
        document.documentElement.dataset.theme = theme
        if (theme === 'light') {
          document.querySelector('meta[name="theme-color"]').content = '#e8e5e3'
        }
      })()
    </script>
    <meta
      name="description"
      content="Dino's Mobile Tires — find your factory tire size in seconds. Shipped to your door, installed at our shop, or mounted wherever you are."
    />
    <title>Dino's Mobile Tires — Delivered or Installed Wherever You Are</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
